<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lari Ada</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-4">
<div class="max-w-md mx-auto">
<h1 class="font-black text-xl">راڻيپور کان ڪراچي</h1>
<button id="searchBtn" class="w-full bg-orange-500 text-white py-3 rounded-xl mt-4 font-bold">بسون ڳوليو</button>
<div id="results" class="mt-4 space-y-3"></div>
</div>
<script>
const buses=[{n:"Al-Habib",p:1200},{n:"Sada Bahar",p:1100},{n:"Maya",p:900}];
function showBuses(){
  const r=document.getElementById('results');
  r.innerHTML='';
  buses.forEach(b=>{
    r.innerHTML+=`<div class="bg-white p-4 rounded-2xl border flex justify-between"><b>${b.n}</b><b class="text-orange-500">Rs.${b.p}</b></div>`;
  });
}
document.getElementById('searchBtn').addEventListener('click',showBuses);
window.addEventListener('load',showBuses);
</script>
</body>
</html>
