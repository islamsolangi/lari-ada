<script>

];

      <div id="timeline-${i}" class="hidden mt-4 border-t pt-4">

        <div class="relative border-l-2 border-dashed border-orange-200 ml-2 pl-6 space-y-4">
          ${bus.stops.map(s=>`
            <div class="relative">
              <div class="absolute -left-[31px] top-1 w-3 h-3 rounded-full ${s.main?'bg-orange-500 ring-2 ring-orange-200':'bg-gray-300'}"></div>

                <p class="font-bold text-sm ${s.main?'text-orange-600':''}">${s.city}</p>
                <p class="text-xs font-bold">${s.time}</p>
              </div>
            </div>
          `).join('')}
